<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 1200x630 OG card. Safe margins: 80px sides, 64px top/bottom. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #070a0e;
    color: #e9eef4;
    font-family: 'JetBrains Mono', monospace;
    padding: 64px 80px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(640px 420px at 12% 0%, rgba(0, 255, 65, 0.10), transparent 68%),
      radial-gradient(760px 480px at 100% 100%, rgba(60, 120, 255, 0.08), transparent 65%);
  }
  .hair {
    position: absolute; z-index: 1; background: #1b2531;
  }
  .hair.v { top: 64px; bottom: 64px; right: 300px; width: 1px; }
  .top, .mid, .foot { position: relative; z-index: 3; }
  .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; letter-spacing: 0.5px; }
  .domain { color: #00ff41; opacity: 0.9; }
  .handle { color: #6b7a8a; }
  .mid { margin-top: auto; margin-bottom: auto; }
  .word {
    font-size: 104px; font-weight: 700; line-height: 1; letter-spacing: -3.5px;
    color: #f4f7fa;
  }
  .cursor {
    display: inline-block; width: 26px; height: 74px; margin-left: 12px;
    background: #00ff41; vertical-align: 6px;
    box-shadow: 0 0 26px rgba(0, 255, 65, 0.45);
  }
  .rule { width: 132px; height: 3px; background: #00ff41; margin: 30px 0 26px; opacity: 0.85; }
  .tag { font-size: 40px; font-weight: 500; color: #e9eef4; letter-spacing: -0.6px; line-height: 1.2; }
  .sub { font-size: 25px; color: #8a97a6; margin-top: 16px; line-height: 1.45; }
  .foot {
    margin-top: auto; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 21px; color: #55636f; letter-spacing: 0.5px;
  }
  .foot .live { color: #00ff41; opacity: 0.75; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="hair v"></div>
  <div class="top"><span class="domain">javierbits.com</span><span class="handle">@javierbits</span></div>
  <div class="mid">
    <p class="word">javierbits<span class="cursor"></span></p>
    <div class="rule"></div>
    <p class="tag">Local AI, security, privacy &amp; crypto</p>
    <p class="sub">4&times; DGX Spark &middot; open benchmarks, serving recipes and fine-tunes</p>
  </div>
  <div class="foot"><span>AGI Checkpoint &middot; weekly</span><span class="live">models &middot; recipes &middot; benchmarks</span></div>
</body>
</html>
